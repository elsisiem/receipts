<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>receipts</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#111110;--panel:#1B1A18;--line:#2A2925;--ink:#EEEAE2;--ink2:#B4AEA2;--ink3:#868174;--bad:#EE6E50;--ok:#82C79D;--warn:#E6B04E}
@media (prefers-color-scheme:light){:root{--bg:#F7F5F0;--panel:#EBE7DE;--line:#DDD7CB;--ink:#1A1916;--ink2:#4E4B44;--ink3:#7C776C;--bad:#B5381F;--ok:#2E6B47;--warn:#94600F}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Satoshi,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:28px 16px 60px}
h1{font-weight:900;font-size:clamp(40px,7vw,80px);letter-spacing:-.03em;line-height:1;margin:0 0 8px}
.sub{color:var(--ink2);font-size:18px;max-width:60ch;margin:0 0 6px}.mono{font-family:"IBM Plex Mono",monospace}
.who{font-size:13px;color:var(--ink3);margin-bottom:30px}
.run{border:1px solid var(--line);border-radius:6px;margin:0 0 28px;overflow:hidden}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--panel);font-size:13px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.col{padding:14px 16px;min-width:0}.col+.col{border-left:1px solid var(--line)}
.lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.msg{white-space:pre-wrap;font-size:15px;line-height:1.5}
.log{white-space:pre-wrap;font-size:12px;line-height:1.45;max-height:260px;overflow:auto;color:var(--ink2);background:var(--bg);padding:10px;border-radius:4px;margin-top:10px}
.claim{display:grid;grid-template-columns:118px 1fr 56px;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.v{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.v.backed{color:var(--ok)}.v.contradicted{color:var(--bad)}.v.never_ran{color:var(--warn)}
.q{font-size:12px;color:var(--ink3);margin-top:3px;word-break:break-word}.p{font-size:12px;color:var(--ink3);text-align:right}
.big{font-weight:900;font-size:44px;line-height:1}.big.bad{color:var(--bad)}
</style></head><body><main>
<h1>receipts</h1>
<p class="sub">Your coding agent says "done, all tests pass". receipts checks every claim against what actually ran.</p>
<p class="who mono">agent: gemini-3.8-flash · claims read by meta muse-spark-1.3 · ruled by subq-snap-1.1 · every run below is real, nothing planted</p>
<div id="runs"></div>
</main><script>
const esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
fetch("/api/runs").then(r=>r.json()).then(rs=>{document.getElementById("runs").innerHTML=rs.map(d=>{
const n=d.claims.length,bad=d._bad;
return `<section class="run"><div class="head mono"><span>run ${d.id} · ${esc(d.checked_at)}</span><span>tests exit code ${d.exit_code} · muse ${d.latency_ms.muse_claims} ms · snap ${d.latency_ms.snap_rulings} ms</span></div>
<div class="grid"><div class="col"><div class="lab">what the agent told you</div><div class="msg">${esc(d.final_message)}</div>
<div class="lab" style="margin-top:14px">what actually ran</div><div class="log mono">${esc(d.session_log)}</div></div>
<div class="col"><div class="lab">receipts</div><div class="big ${bad?"bad":""}">${bad?bad+" of "+n+" claims unbacked":n+" of "+n+" backed"}</div>
${d.claims.map(c=>`<div class="claim"><div class="v ${c.verdict}">${c.verdict.replace("_"," ")}</div><div>${esc(c.claim)}${c.log_quote?`<div class="q mono">log: ${esc(c.log_quote)}${c.quote_verified?"":" (quote not found in log)"}</div>`:`<div class="q mono">log: nothing</div>`}</div><div class="p mono">${Math.round(c.confidence*100)}%</div></div>`).join("")}
</div></div></section>`}).join("")})
</script></body></html>
